name: Publicar Terço — Contemple os Mistérios (PWA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terco-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ferramentas locais de ilustração e narração
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install 'Pillow>=10,<12'

      - name: Confirmar as 20 pinturas originais do repositório
        run: |
          python - <<'PY'
          from pathlib import Path
          d = Path("web/assets/misterios")
          nomes = {f"{tipo}-{i}.webp" for tipo in ("gozosos","luminosos","dolorosos","gloriosos") for i in range(1,6)}
          presentes = {p.name for p in d.glob("*.webp")}
          assert presentes == nomes, f"Pinturas ausentes/inesperadas: {sorted(nomes ^ presentes)}"
          assert all((d / n).stat().st_size > 10000 for n in nomes)
          print("20 pinturas WebP conferidas")
          PY

      - name: Preparar 20 imagens WebP e 28 áudios em português para uso offline
        run: python scripts/generate_assets.py

      - name: Validar arquivos indispensáveis do PWA
        run: |
          node --check web/app.js
          node --check web/sw.js
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('web')
          m=json.loads((p/'manifest.webmanifest').read_text())
          assert m.get('name'), 'Manifesto sem nome'
          assert (p/'index.html').is_file()
          assert (p/'content.json').is_file()
          assert len(list((p/'assets/misterios').glob('*.webp')))==20
          assert len(list((p/'assets/audio').glob('*.ogg')))==28
          assert (p/'icon-192.png').is_file()
          assert (p/'icon-512.png').is_file()
          print('OK: 20 imagens WebP, 28 narrações e componentes do PWA presentes')
          PY

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
