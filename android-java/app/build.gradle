plugins { id 'com.android.application' }
android {
    namespace 'br.com.tercocontemple'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.tercocontemple'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress += ['ogg','png'] }
    buildTypes { release { minifyEnabled false } }
}