plugins { id 'com.android.application' }

android {
    namespace 'br.com.tercocontemple'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.tercocontemple'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '0.4.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Os áudios são entregues no APK para funcionar sem internet.
    androidResources { noCompress += ['mp3', 'webp'] }
    buildTypes {
        debug { applicationIdSuffix '.beta'; versionNameSuffix '-beta' }
        release { minifyEnabled false }
    }
}
